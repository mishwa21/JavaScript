<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="squi.webp" alt="" width="600px">
    <script>
        img = document.querySelector('img')
        function threeslider(){
            if(img.src.match('squi.webp')){
                img.src="dog.jpg"
            }
            else if(img.src.match('dog.jpg')){
                img.src="cat.jpg"
            }
            else{
                img.src="squi.webp"
            }
        }
        setInterval(threeslider,1000)
    </script>
</body>
</html>
